name: real-dssat-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/one-event-irrigation-smoke-v1
      - feat/agricultural-protocol-v1
      - feat/formal-agricultural-baselines-v1
  pull_request:
    paths:
      - 'dssat_workspace_template/**'
      - 'run/real_smoke/**'
      - 'run/formal/**'
      - 'configs/engineering_*smoke*.json'
      - 'configs/formal_*smoke*.json'
      - 'configs/agricultural_protocol_v1.json'
      - 'configs/agricultural_baselines_v1.json'
      - 'src/awm/dssat/**'
      - 'src/awm/envs/**'
      - 'src/awm/baselines/**'

jobs:
  reset-and-one-event:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      SWEEP_DIR: runtime/development_baseline_sweep_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make custom DSSAT executable runnable
        run: chmod +x dssat_workspace_template/dscsm048
      - name: Real engineering zero-event reset smoke
        run: |
          python -m awm.dssat.smoke \
            --config configs/engineering_reset_smoke_v3_2000.json
      - name: Real engineering one-event irrigation smoke
        run: |
          python -m awm.baselines.one_event_smoke \
            --config configs/engineering_one_event_smoke_v3_2000.json \
            --audit-output /tmp/awm_one_event.audit.json
      - name: Audit formal agricultural COX v1
        run: |
          python - <<'PY'
          from awm.dssat.cox_audit import audit_cox_template
          report = audit_cox_template(
              'run/formal/awm_protocol_v1_2000.COX.in',
              expected_nonpolicy_irrigation_mm=45.0,
              irrigation_tolerance_mm=0.1,
          )
          print(report)
          if report['structural_status'] != 'passed':
              raise SystemExit('formal COX structural audit failed')
          if not report['protocol_ready']:
              raise SystemExit(f"formal COX protocol audit failed: {report['review_flags']}")
          if abs(float(report['explicit_nonpolicy_irrigation_total_mm']) - 45.0) > 0.1:
              raise SystemExit('formal COX fixed preplant irrigation is not 45 mm')
          if abs(float(report['explicit_fertilizer_n_total_kg_ha']) - 235.0) > 1e-9:
              raise SystemExit('formal COX fixed-N total is not 235 kg/ha')
          PY
      - name: Real formal protocol-v1 reset smoke
        run: |
          python -m awm.dssat.smoke \
            --config configs/formal_reset_smoke_protocol_v1_2000.json
      - name: Real formal W100 agricultural baseline smokes
        run: |
          for method in conventional et rew; do
            echo "===== ${method} W100 ====="
            python -m awm.baselines.smoke \
              --config "configs/formal_baseline_${method}_w100_2000.json" \
              --audit-output "/tmp/awm_${method}_w100_2000.audit.json"
          done
      - name: Real formal W80 agricultural baseline smokes
        run: |
          for method in conventional et rew; do
            echo "===== ${method} W80 ====="
            python -m awm.baselines.smoke \
              --config "configs/formal_baseline_${method}_w80_2000.json" \
              --audit-output "/tmp/awm_${method}_w80_2000.audit.json"
          done
      - name: Real formal W60 agricultural baseline smokes
        run: |
          for method in conventional et rew; do
            echo "===== ${method} W60 ====="
            python -m awm.baselines.smoke \
              --config "configs/formal_baseline_${method}_w60_2000.json" \
              --audit-output "/tmp/awm_${method}_w60_2000.audit.json"
          done
      - name: Real cross-year materializer gate (2001 and 2022)
        run: |
          python -m awm.baselines.development_sweep \
            --project-root . \
            --years 2001,2022 \
            --methods conventional,rew \
            --treatments W100,W60 \
            --work-dir runtime/cross_year_gate
      - name: Run canonical 207-episode development sweep
        run: |
          python -m awm.baselines.development_sweep \
            --project-root . \
            --years 2000-2022 \
            --methods conventional,et,rew \
            --treatments W100,W80,W60 \
            --work-dir "$SWEEP_DIR"
      - name: Validate and summarize canonical development matrix
        run: |
          python -m awm.baselines.sweep_summary \
            --results "$SWEEP_DIR/results.jsonl" \
            --output "$SWEEP_DIR/summary.json"
      - name: Final canonical development integrity gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runtime/development_baseline_sweep_v1')
          rows = [json.loads(line) for line in (root / 'results.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          keys = {(int(r['year']), r['method'], r['water_treatment']) for r in rows}
          assert len(rows) == 207
          assert len(keys) == 207
          assert all(r['status'] == 'passed' for r in rows)
          assert all(r['weather_source'] == 'era5' for r in rows)
          assert all(2000 <= int(r['year']) <= 2022 for r in rows)
          assert not any(int(r['year']) in (2023, 2024, 2025) for r in rows)
          assert all(r['irrigation_accounting_passed'] is True for r in rows)
          assert summary['integrity']['status'] == 'passed'
          assert summary['integrity']['row_count'] == 207
          assert summary['descriptive']['formal_y_ref_defined'] is False
          assert summary['descriptive']['eta_defined'] is False
          assert summary['descriptive']['alpha_defined'] is False
          assert manifest['episode_count'] == 207
          assert manifest['locked_final_test_years'] == [2023, 2024, 2025]
          print('CANONICAL DEVELOPMENT SWEEP PASS')
          print('rows=207 unique=207 accounting=207/207')
          print('years=2000-2022; locked_final_test=2023,2024,2025')
          PY
      - name: Upload canonical development sweep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awm-development-baseline-sweep-v1
          path: |
            runtime/development_baseline_sweep_v1/manifest.json
            runtime/development_baseline_sweep_v1/results.jsonl
            runtime/development_baseline_sweep_v1/results.csv
            runtime/development_baseline_sweep_v1/summary.json
            runtime/development_baseline_sweep_v1/audits/
          if-no-files-found: warn
          retention-days: 30
